name: Fork Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or reuse, e.g. v19.0.1'
        required: true
        type: string
      target_ref:
        description: 'Branch, tag, or commit SHA to tag when the tag does not already exist'
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
          fetch-depth: 0

      - name: Prepare release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="$REF_NAME"
          fi

          if [[ ! "$TAG_NAME" =~ ^v.+ ]]; then
            echo "::error::Release tag must start with 'v'. Got: $TAG_NAME"
            exit 1
          fi

          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" > /dev/null; then
            echo "Using existing tag $TAG_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
          else
            echo "::error::Tag $TAG_NAME was not found after tag-triggered checkout"
            exit 1
          fi

          git checkout --detach "$TAG_NAME"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle

      - name: Build unsigned APK
        run: ./gradlew :app-thunderbird:assembleFossRelease

      - name: Sign APK
        id: sign
        uses: noriban/sign-android-release@a0600624488748d90ba893de54d52d41417dc64f # v5
        with:
          releaseDirectory: app-thunderbird/build/outputs/apk/foss/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}

      - name: Rename APK for release
        id: rename
        run: |
          SIGNED="${{ steps.sign.outputs.signedReleaseFile }}"
          RENAMED="$(dirname "$SIGNED")/relaymail-${{ steps.release.outputs.tag_name }}.apk"
          mv "$SIGNED" "$RENAMED"
          echo "apk=$RENAMED" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: ${{ steps.rename.outputs.apk }}
          generate_release_notes: true
