name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * *" # Every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: thunderbird/thunderbird-android
      UPSTREAM_BRANCH: main
      SYNC_BRANCH_PREFIX: sync/upstream-

    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Attempt merge
        id: merge
        run: |
          if git merge "upstream/$UPSTREAM_BRANCH" --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to main (no conflicts)
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin HEAD

      - name: Determine sync branch
        id: branch
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: |
          set -euo pipefail

          BOT_AUTHOR="github-actions[bot]"

          # Find an existing open sync PR (if any).
          # --repo is required because the `upstream` remote we added earlier
          # makes gh default to the parent repo otherwise.
          EXISTING_BRANCH=$(gh pr list --repo ${{ github.repository }} --state open --json headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"${SYNC_BRANCH_PREFIX}\"))][0].headRefName // empty")

          REFRESH=false
          if [ -n "$EXISTING_BRANCH" ]; then
            git fetch origin "$EXISTING_BRANCH"

            # First-parent count from main: 1 means the only commit on top of main
            # is the bot's automated merge commit.
            COMMITS=$(git rev-list --first-parent --count "origin/main..origin/$EXISTING_BRANCH")
            LAST_AUTHOR=$(git log -1 --format='%an' "origin/$EXISTING_BRANCH")
            LAST_MSG=$(git log -1 --format='%s' "origin/$EXISTING_BRANCH")

            case "$LAST_MSG" in
              "Merge upstream/$UPSTREAM_BRANCH (conflicts need manual resolution)"|"Merge upstream/$UPSTREAM_BRANCH (conflicts auto-resolved by Claude)")
                MSG_KNOWN=true ;;
              *)
                MSG_KNOWN=false ;;
            esac

            if [ "$COMMITS" = "1" ] && [ "$LAST_AUTHOR" = "$BOT_AUTHOR" ] && [ "$MSG_KNOWN" = "true" ]; then
              REFRESH=true
              BRANCH="$EXISTING_BRANCH"
              echo "Existing branch $BRANCH is untouched — refreshing it."
            else
              echo "Existing branch $EXISTING_BRANCH has human commits — opening a new PR."
              BRANCH="${SYNC_BRANCH_PREFIX}$(date +%Y-%m-%d)-${{ github.run_id }}"
            fi
          else
            BRANCH="${SYNC_BRANCH_PREFIX}$(date +%Y-%m-%d)-${{ github.run_id }}"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "refresh=$REFRESH" >> "$GITHUB_OUTPUT"

      - name: Set up sync branch and re-merge upstream
        if: steps.merge.outputs.conflict == 'true'
        run: |
          git checkout -B "${{ steps.branch.outputs.branch }}" origin/main
          # Re-run the merge so the working tree has conflict markers for Claude.
          git merge "upstream/$UPSTREAM_BRANCH" --no-edit || true

      - name: Resolve conflicts with Claude
        id: claude
        if: steps.merge.outputs.conflict == 'true'
        uses: anthropics/claude-code-action@2cc1ac1331eac7a6a96d716dd204dd2888d0fcd2 # v1
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A `git merge upstream/${{ env.UPSTREAM_BRANCH }}` (from `${{ env.UPSTREAM_REPO }}`) has just left conflict markers in the working tree of this fork. Your task: resolve the conflicts safely and stage the resolved files.

            1. List unmerged files: `git diff --name-only --diff-filter=U`
            2. For each file, read it, understand both sides of every conflict, and write a clean resolved version.
               - This is an upstream sync. Default to upstream's version unless there is clear fork-specific intent (e.g. fork-only commits visible via `git log origin/main`) that must be preserved.
               - Never leave `<<<<<<<`, `=======`, or `>>>>>>>` markers in the resolved file.
            3. After resolving a file, stage it: `git add <file>`.
            4. If a file is genuinely unsafe to resolve (ambiguous business logic, large rewrites on both sides), leave it unstaged with markers intact — a human will pick it up.
            5. Do NOT run `git commit`. Do NOT amend or push. Just stage what you resolved.
            6. End with a one-paragraph summary of files resolved vs. left for human.
          claude_args: |
            --max-turns 16
            --allowedTools "Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git ls-files:*),Bash(git log:*),Read,Edit,Glob,Grep"

      - name: Commit merge result
        id: outcome
        if: steps.merge.outputs.conflict == 'true'
        run: |
          set -euo pipefail
          # Stage anything Claude didn't (so the PR shows the full state either way).
          git add -A

          # `git diff --cached --check` lists "leftover conflict marker" lines for any
          # staged content that still contains <<<<<<< / ======= / >>>>>>>.
          # It exits non-zero when it reports issues, so capture the output first
          # (with `|| true` to neutralize the failing exit under pipefail) and then
          # grep the captured string — never pipe `git diff --check` directly.
          DIFF_CHECK=$(git diff --cached --check 2>&1 || true)
          if printf '%s' "$DIFF_CHECK" | grep -q "leftover conflict marker"; then
            echo "Conflict markers remain in staged content — falling back to manual-resolution PR."
            CLAUDE_RESOLVED=false
            COMMIT_MSG="Merge upstream/$UPSTREAM_BRANCH (conflicts need manual resolution)"
          else
            CLAUDE_RESOLVED=true
            COMMIT_MSG="Merge upstream/$UPSTREAM_BRANCH (conflicts auto-resolved by Claude)"
          fi

          echo "claude_resolved=$CLAUDE_RESOLVED" >> "$GITHUB_OUTPUT"
          git commit -m "$COMMIT_MSG"

      - name: Push branch
        if: steps.merge.outputs.conflict == 'true'
        run: |
          set -euo pipefail
          BRANCH="${{ steps.branch.outputs.branch }}"
          if [ "${{ steps.branch.outputs.refresh }}" = "true" ]; then
            git push --force-with-lease origin "$BRANCH"
            echo "Refreshed existing PR for branch $BRANCH"
          else
            git push -u origin "$BRANCH"
          fi

      - name: Create or update PR
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          REFRESH: ${{ steps.branch.outputs.refresh }}
          RESOLVED: ${{ steps.outcome.outputs.claude_resolved }}
        run: |
          set -euo pipefail

          if [ "$RESOLVED" = "true" ]; then
            TITLE="Upstream sync — Claude resolved, please review"
            BODY=$(cat <<'EOF'
          Automated upstream sync encountered merge conflicts. **Claude attempted to resolve them automatically.**

          **What happened:**
          - Attempted to merge `${{ env.UPSTREAM_REPO }}:${{ env.UPSTREAM_BRANCH }}` into `main`
          - Merge conflicts were detected
          - Claude Code resolved the conflicts and committed the result

          **What to do:**
          1. Review the diff carefully — Claude's resolution is best-effort
          2. If correct, approve and merge
          3. If something is wrong, push fixes to this branch (subsequent runs will not force-overwrite human commits)

          cc @${{ github.repository_owner }}

          _Created automatically by the sync-upstream workflow._
          EOF
            )
          else
            TITLE="Upstream sync — manual merge needed"
            BODY=$(cat <<'EOF'
          Automated upstream sync encountered merge conflicts. Claude was unable to resolve them safely.

          **What happened:**
          - Attempted to merge `${{ env.UPSTREAM_REPO }}:${{ env.UPSTREAM_BRANCH }}` into `main`
          - Merge conflicts were detected
          - Conflict markers remain in the diff

          **What to do:**
          1. Check out this branch locally
          2. Merge `main` into this branch (or rebase) and resolve conflicts
          3. Push and merge this PR

          cc @${{ github.repository_owner }}

          _Created automatically by the sync-upstream workflow._
          EOF
            )
          fi

          if [ "$REFRESH" = "true" ]; then
            gh pr edit "$BRANCH" --repo ${{ github.repository }} --title "$TITLE" --body "$BODY"
            gh pr comment "$BRANCH" --repo ${{ github.repository }} \
              --body "Branch refreshed by sync workflow run #${{ github.run_id }}. cc @${{ github.repository_owner }}"
          else
            gh pr create \
              --title "$TITLE" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH" \
              --label "report: include" \
              --repo ${{ github.repository }}
          fi
