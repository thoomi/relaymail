name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * *" # Every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/thunderbird/thunderbird-android.git
          git fetch upstream main

      - name: Attempt merge
        id: merge
        run: |
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to main (no conflicts)
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin main

      - name: Create or refresh conflict PR
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: |
          set -euo pipefail

          BOT_MSG="Merge upstream/main (conflicts need manual resolution)"
          BOT_AUTHOR="github-actions[bot]"

          # Find an existing open sync PR (if any)
          EXISTING_BRANCH=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("sync/upstream-"))][0].headRefName // empty')

          REFRESH=false
          if [ -n "$EXISTING_BRANCH" ]; then
            git fetch origin "$EXISTING_BRANCH"

            # First-parent count from main: 1 means the only commit on top of main
            # is the bot's automated merge commit.
            COMMITS=$(git rev-list --first-parent --count "origin/main..origin/$EXISTING_BRANCH")
            LAST_AUTHOR=$(git log -1 --format='%an' "origin/$EXISTING_BRANCH")
            LAST_MSG=$(git log -1 --format='%s' "origin/$EXISTING_BRANCH")

            if [ "$COMMITS" = "1" ] && [ "$LAST_AUTHOR" = "$BOT_AUTHOR" ] && [ "$LAST_MSG" = "$BOT_MSG" ]; then
              REFRESH=true
              BRANCH="$EXISTING_BRANCH"
              echo "Existing branch $BRANCH is untouched — refreshing it."
            else
              echo "Existing branch $EXISTING_BRANCH has human commits — opening a new PR."
              BRANCH="sync/upstream-$(date +%Y-%m-%d)-${{ github.run_id }}"
            fi
          else
            BRANCH="sync/upstream-$(date +%Y-%m-%d)-${{ github.run_id }}"
          fi

          git checkout -B "$BRANCH" origin/main
          git merge upstream/main --no-edit || true
          git add -A
          git commit -m "$BOT_MSG"

          if [ "$REFRESH" = "true" ]; then
            git push --force-with-lease origin "$BRANCH"
            echo "Refreshed existing PR for branch $BRANCH"
          else
            git push -u origin "$BRANCH"
            gh pr create \
              --title "Upstream sync — manual merge needed" \
              --body "$(cat <<'EOF'
          Automated upstream sync encountered merge conflicts.

          **What happened:**
          - Attempted to merge `thunderbird/thunderbird-android:main` into `main`
          - Merge conflicts were detected

          **What to do:**
          1. Check out this branch locally
          2. Merge `main` into this branch (or rebase) and resolve conflicts
          3. Push and merge this PR

          _Created automatically by the sync-upstream workflow._
          EOF
          )" \
              --base main \
              --head "$BRANCH" \
              --label "report: include" \
              --repo thoomi/relaymail
          fi
