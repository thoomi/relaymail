name: Sync Upstream

on:
  schedule:
    - cron: "0 6 * * *" # Every day at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

defaults:
  run:
    shell: bash

env:
  TARGET_BRANCH: main
  UPSTREAM_REPO: thunderbird/thunderbird-android
  UPSTREAM_BRANCH: main
  SYNC_BRANCH_PREFIX: sync/upstream-
  SYNC_LABEL: "report: include"

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          if git remote get-url upstream > /dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Attempt merge
        id: merge
        run: |
          set -euo pipefail

          BEFORE_SHA=$(git rev-parse HEAD)
          SYNC_COMMIT_MSG_CLEAN="Merge upstream/$UPSTREAM_BRANCH"
          if git merge --no-ff "upstream/$UPSTREAM_BRANCH" -m "$SYNC_COMMIT_MSG_CLEAN"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            if [ "$(git rev-parse HEAD)" = "$BEFORE_SHA" ]; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "Already up to date with upstream/$UPSTREAM_BRANCH"
            else
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "Merged upstream/$UPSTREAM_BRANCH cleanly"
            fi
          else
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Merge conflicts detected"
          fi

      - name: Stop when already up to date
        if: steps.merge.outputs.has_changes == 'false'
        run: echo "No upstream changes to sync."

      - name: Determine sync branch
        id: branch
        if: steps.merge.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: python3 .github/scripts/sync-upstream/select_branch.py

      - name: Move clean sync branch to merge result
        if: steps.merge.outputs.conflict == 'false' && steps.merge.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git checkout -B "${{ steps.branch.outputs.branch }}"

      - name: Set up sync branch and re-merge upstream
        if: steps.merge.outputs.conflict == 'true'
        run: |
          set -euo pipefail
          echo "Recreating sync branch '${{ steps.branch.outputs.branch }}' from origin/$TARGET_BRANCH"
          git checkout -B "${{ steps.branch.outputs.branch }}" "origin/$TARGET_BRANCH"
          echo "Re-running merge from upstream/$UPSTREAM_BRANCH to restore conflict markers"
          git merge --no-ff "upstream/$UPSTREAM_BRANCH" -m "Merge upstream/$UPSTREAM_BRANCH" || true
          echo "Unmerged files after re-merge:"
          git diff --name-only --diff-filter=U || true

      - name: Prepare conflict brief
        if: steps.merge.outputs.conflict == 'true'
        run: python3 .github/scripts/sync-upstream/prepare_conflict_brief.py

      - name: Check Claude availability
        id: claude_config
        if: steps.merge.outputs.conflict == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not configured; opening a manual-resolution issue."
          fi

      - name: Resolve conflicts with Claude
        id: claude
        if: steps.merge.outputs.conflict == 'true' && steps.claude_config.outputs.available == 'true'
        uses: anthropics/claude-code-action@2cc1ac1331eac7a6a96d716dd204dd2888d0fcd2 # v1
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A `git merge upstream/${{ env.UPSTREAM_BRANCH }}` (from `${{ env.UPSTREAM_REPO }}`) has just left conflict markers in the working tree of this fork. Your task: resolve the conflicts safely and stage the resolved files.

            Start by reading `.git/sync-upstream-conflict-brief.md`. Treat it as the primary context. Do not proactively read unrelated files or broad repository history. Pull additional context only when the brief is insufficient to resolve a specific conflict safely.

            1. Read `.git/sync-upstream-conflict-brief.md`.
            2. For each unmerged file, decide whether the brief is enough.
               - If yes, resolve the file directly.
               - If not, fetch only the smallest extra context needed for that file, such as:
                 - `git show :2:<file>` for our side
                 - `git show :3:<file>` for upstream's side
                 - `git log --oneline upstream/${{ env.UPSTREAM_BRANCH }}..origin/${{ env.TARGET_BRANCH }} -- <file>` for fork-only intent
                 - reading the full file itself
            3. This is an upstream sync. Default to upstream's version unless there is clear fork-specific intent that must be preserved.
            4. Never leave `<<<<<<<`, `=======`, or `>>>>>>>` markers in a resolved file.
            5. After resolving a file, stage it with `git add <file>`.
            6. If a file is genuinely unsafe to resolve, leave it unstaged with markers intact so a human can pick it up.
            7. Do NOT run `git commit`. Do NOT amend or push. Just stage what you resolved.
            8. Return a structured summary describing:
               - which files you resolved
               - any extra context you had to fetch beyond the brief
               - which files, if any, still need human review
          claude_args: |
            --max-turns 16
            --json-schema '{"type":"object","properties":{"summary":{"type":"string","description":"A concise reviewer-facing summary of what was resolved, what extra context was needed, and what still needs human review."}},"required":["summary"],"additionalProperties":false}'
            --allowedTools "Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git ls-files:*),Bash(git log:*),Bash(git show:*),Read,Edit,Glob,Grep"

      - name: Commit conflict merge result
        id: outcome
        if: steps.merge.outputs.conflict == 'true'
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: python3 .github/scripts/sync-upstream/commit_conflict_result.py

      - name: Push branch
        if: steps.merge.outputs.has_changes == 'true' && (steps.merge.outputs.conflict == 'false' || steps.outcome.outputs.ready_for_pr == 'true')
        run: python3 .github/scripts/sync-upstream/push_branch.py "${{ steps.branch.outputs.branch }}" "${{ steps.branch.outputs.refresh }}"

      - name: Create or update PR
        if: steps.merge.outputs.has_changes == 'true' && (steps.merge.outputs.conflict == 'false' || steps.outcome.outputs.ready_for_pr == 'true')
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          REFRESH: ${{ steps.branch.outputs.refresh }}
          MERGE_CONFLICT: ${{ steps.merge.outputs.conflict }}
          RESOLVED: ${{ steps.outcome.outputs.claude_resolved }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: python3 .github/scripts/sync-upstream/upsert_pr.py

      - name: Create or update manual-resolution issue
        if: steps.merge.outputs.conflict == 'true' && steps.outcome.outputs.ready_for_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_AVAILABLE: ${{ steps.claude_config.outputs.available }}
          MANUAL_REASON: ${{ steps.outcome.outputs.manual_reason }}
        run: python3 .github/scripts/sync-upstream/upsert_manual_issue.py
